<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Iron Log</title>

<!-- Home-screen app behavior (iOS + Android) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#17181A">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%2317181A'/%3E%3Ccircle cx='90' cy='90' r='10' fill='%23C9472B'/%3E%3Crect x='40' y='84' width='100' height='12' rx='6' fill='%23EDEAE3'/%3E%3Crect x='22' y='72' width='16' height='36' rx='4' fill='%23C9472B'/%3E%3Crect x='142' y='72' width='16' height='36' rx='4' fill='%23C9472B'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%2317181A'/%3E%3Ccircle cx='90' cy='90' r='10' fill='%23C9472B'/%3E%3Crect x='40' y='84' width='100' height='12' rx='6' fill='%23EDEAE3'/%3E%3Crect x='22' y='72' width='16' height='36' rx='4' fill='%23C9472B'/%3E%3Crect x='142' y='72' width='16' height='36' rx='4' fill='%23C9472B'/%3E%3C/svg%3E">

<style>
  :root{
    --bg: #17181A;
    --surface: #1F2023;
    --surface-raised: #26282C;
    --line: #303236;
    --ink: #EDEAE3;
    --ink-dim: #96999E;
    --ink-faint: #5C5F65;
    --iron: #C9472B;
    --iron-dim: #C9472B33;
    --brass: #C9A227;
    --steel: #4C7A9A;
    --ok: #5C9068;
    --tabbar-h: 64px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;overscroll-behavior-y:none;max-width:100%;overflow-x:hidden;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
  }
  .shell, .app-area, .main{max-width:100%;}
  ::selection{background:var(--iron-dim);}
  input, textarea{
    font-family:'JetBrains Mono',monospace;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:4px;
    padding:8px 8px;
    font-size:13px;
    width:100%;
    outline:none;
    transition:border-color .15s;
  }
  input:focus, textarea:focus{border-color:var(--iron);}
  input::placeholder, textarea::placeholder{color:var(--ink-faint);font-family:'Inter',sans-serif;}
  textarea{font-family:'Inter',sans-serif;resize:vertical;min-height:34px;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  a{color:inherit;}
  svg{display:block;}

  /* ---------- tap feedback ---------- */
  .tap{transition:transform .12s ease, opacity .12s ease;}
  .tap:active{transform:scale(0.94);opacity:.8;}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:200px;flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:20px 0;
  }
  .brand{padding:0 20px 20px 20px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .brand-mark{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;letter-spacing:.03em;color:var(--ink);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand-mark .dot{width:8px;height:8px;border-radius:50%;background:var(--iron);flex-shrink:0;}
  .brand-sub{font-size:10.5px;color:var(--ink-faint);margin-top:4px;letter-spacing:.04em;text-transform:uppercase;}
  .side-item{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--ink-dim);font-size:13.5px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:.15s;}
  .side-item:hover{color:var(--ink);background:var(--surface-raised);}
  .side-item.active{color:var(--ink);border-left-color:var(--iron);background:var(--surface-raised);}
  .side-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}

  .app-area{flex:1;min-width:0;display:flex;flex-direction:column;}

  /* top bar (mobile) */
  .topbar{
    display:none;align-items:center;justify-content:space-between;
    padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:15;
  }
  .topbar .tb-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.02em;text-transform:uppercase;}
  .topbar .tb-mark{display:flex;align-items:center;gap:7px;}
  .topbar .tb-mark .dot{width:7px;height:7px;border-radius:50%;background:var(--iron);}

  .main{flex:1;min-width:0;padding:32px 40px 60px;max-width:900px;width:100%;}
  .main.transitioning{animation:pageIn .22s ease;}
  @keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- bottom tab bar (mobile, native-app style) ---------- */
  .tabbar{
    display:none;
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(31,32,35,0.88);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    justify-content:space-around;align-items:center;
  }
  .tab-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--ink-faint);flex:1;height:100%;font-size:10px;font-weight:500;
    letter-spacing:.01em;
  }
  .tab-btn svg{width:22px;height:22px;transition:.15s;}
  .tab-btn.active{color:var(--iron);}
  .tab-btn.active svg{transform:translateY(-1px);}

  /* ---------- plate divider (signature) ---------- */
  .plate-divider{display:flex;align-items:center;gap:6px;margin:18px 0 26px;}
  .plate-divider .bar{flex:1;height:2px;background:var(--line);}
  .plate-divider .plates{display:flex;align-items:center;gap:3px;}
  .plate-divider .p{border-radius:50%;background:var(--surface-raised);border:2px solid var(--line);}
  .plate-divider .p1{width:20px;height:20px;}
  .plate-divider .p2{width:14px;height:14px;border-color:var(--iron);}
  .plate-divider .p3{width:9px;height:9px;border-color:var(--brass);}

  h1.page-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;letter-spacing:.01em;margin:0 0 4px;text-transform:uppercase;}
  .page-sub{color:var(--ink-dim);font-size:13.5px;margin:0;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:14px;}
  .card h2{font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;color:var(--brass);font-weight:600;}
  .kv-grid{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;font-size:13.5px;}
  .kv-grid .k{color:var(--ink-faint);font-weight:500;}
  .kv-grid .v{color:var(--ink);}
  .week-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px;}
  .week-pill{background:var(--surface-raised);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;}
  .week-pill .wn{font-family:'Oswald',sans-serif;color:var(--iron);font-size:13px;font-weight:600;margin-bottom:3px;}
  .sched-grid{display:grid;gap:8px;}
  .sched-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface-raised);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:13px;cursor:pointer;}
  .sched-row .d{color:var(--ink-faint);font-family:'JetBrains Mono',monospace;font-size:11.5px;}

  /* ---------- train page ---------- */
  .day-chips{display:flex;gap:8px;margin:16px 0 4px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
  .day-chip{
    flex-shrink:0;padding:9px 15px;border-radius:20px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-dim);font-size:12.5px;font-weight:600;
    white-space:nowrap;
  }
  .day-chip.active{background:var(--iron);border-color:var(--iron);color:#fff;}
  .day-chip .flame{margin-left:4px;}

  .week-tabs{display:flex;gap:6px;margin:18px 0 18px;}
  .week-tab{flex:1;text-align:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-dim);font-size:12.5px;font-weight:600;}
  .week-tab.active{background:var(--surface-raised);border-color:var(--brass);color:var(--brass);}

  .week-meta{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;color:var(--ink-dim);}
  .week-meta b{color:var(--brass);font-family:'Oswald',sans-serif;letter-spacing:.03em;font-weight:600;}

  .swipe-hint{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-faint);font-size:10.5px;margin:-6px 0 16px;}
  .swipe-hint svg{width:12px;height:12px;}

  .date-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .date-row label{font-size:12px;color:var(--ink-faint);font-weight:500;white-space:nowrap;}
  .date-row input{max-width:170px;}

  .exercise{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;max-width:100%;overflow:hidden;}
  .exercise-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .ex-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.01em;}
  .ex-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
  .tag{font-size:10.5px;color:var(--ink-faint);border:1px solid var(--line);border-radius:3px;padding:2px 6px;font-family:'JetBrains Mono',monospace;}
  .ex-volume{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);text-align:right;white-space:nowrap;}
  .ex-volume b{color:var(--iron);font-size:15px;display:block;}
  .set-rows{margin-bottom:4px;}
  .set-col-labels{display:flex;gap:8px;margin-bottom:6px;padding-left:34px;}
  .set-col-labels span{flex:1;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);text-align:center;font-weight:500;}
  .set-row{display:flex;gap:8px;align-items:center;margin-bottom:7px;}
  .set-row .set-num{width:26px;flex-shrink:0;color:var(--ink-faint);font-size:11.5px;font-family:'JetBrains Mono',monospace;}
  .set-row .field{flex:1;min-width:0;}
  .set-row input{width:100%;text-align:center;padding:9px 4px;}
  .notes-field{margin-top:6px;}
  .notes-field textarea{font-size:12.5px;}

  .total-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface-raised);border:1px solid var(--line);border-radius:10px;padding:13px 18px;margin-top:6px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:13px;font-weight:600;}
  .total-row .num{font-family:'JetBrains Mono',monospace;color:var(--brass);font-size:17px;text-transform:none;letter-spacing:0;}

  /* ---------- progress ---------- */
  .prog-table{width:100%;border-collapse:collapse;font-size:13px;}
  .prog-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500;}
  .prog-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .prog-table input{min-width:80px;}
  .prog-table tr:last-child td{border-bottom:none;}
  .add-row-btn{margin-top:12px;background:transparent;border:1px dashed var(--line);color:var(--ink-dim);border-radius:8px;padding:10px 14px;font-size:12.5px;width:100%;}
  .add-row-btn:active{border-color:var(--iron);color:var(--ink);}
  .del-btn{background:transparent;border:none;color:var(--ink-faint);font-size:16px;padding:2px 6px;}
  .del-btn:active{color:var(--iron);}

  /* ---------- summary ---------- */
  .lift-row{margin-bottom:18px;}
  .lift-row .lift-name{font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em;}
  .bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .bar-col{background:var(--surface-raised);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;}
  .bar-col .wk{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .bar-col .wt{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--brass);font-weight:700;}
  .bar-col .wt.empty{color:var(--ink-faint);font-size:12px;font-weight:400;}
  .bar-fill-track{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--iron);border-radius:2px;transition:width .3s;}

  .save-toast{
    position:fixed;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);left:50%;transform:translateX(-50%) translateY(6px);
    background:var(--surface-raised);border:1px solid var(--ok);color:var(--ink);padding:8px 16px;border-radius:20px;
    font-size:12px;display:flex;align-items:center;gap:7px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;
  }
  .save-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .save-toast .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}

  .footer-actions{display:flex;justify-content:flex-end;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);}
  .reset-btn{background:transparent;border:1px solid var(--line);color:var(--ink-faint);border-radius:8px;padding:9px 14px;font-size:12px;}
  .reset-btn:active{border-color:var(--iron);color:var(--iron);}

  .loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:100;}
  .loading-screen .dot{width:10px;height:10px;border-radius:50%;background:var(--iron);animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1.1);}}

  @media (max-width: 820px){
    .sidebar{display:none;}
    .topbar{display:flex;}
    .tabbar{display:flex;}
    .main{padding:18px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);}
    .kv-grid{grid-template-columns:1fr;}
    .week-strip{grid-template-columns:repeat(2,1fr);}
    .bars{grid-template-columns:repeat(2,1fr);}
    body{padding-bottom:0;}
  }
  @media (min-width: 821px){
    .day-chips{display:none;}
  }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="dot"></div>
  <div style="color:var(--ink-faint);font-size:12px;font-family:'JetBrains Mono',monospace;">LOADING LOG…</div>
</div>

<div class="shell" id="shell" style="display:none;">
  <nav class="sidebar" id="sidebar"></nav>

  <div class="app-area">
    <div class="topbar" id="topbar">
      <div class="tb-mark"><span class="dot"></span><span class="tb-title" id="tbTitle">Iron Log</span></div>

    <main class="main" id="main"></main>
  </div>
</div>

<div class="tabbar" id="tabbar"></div>
<div class="save-toast" id="saveToast"><span class="dot"></span>Saved</div>

<script>
/* ============================= ICONS ============================= */

/* ============================= DATA ============================= */

const WEEKS = [
  {n:1, label:'Baseline', rir:'~2 RIR', note:'Establish correct working weights. No unnecessary failure.'},
  {n:2, label:'Progression', rir:'~1–2 RIR', note:'Add 1 rep/set. Increase weight only after reaching top of rep range.'},

];

const MAIN_LIFTS = [
  {label:'Barbell Bench Press', day:'day1', exIndex:0},
  {label:'Back Squat', day:'day3', exIndex:0},
  {label:'Romanian Deadlift', day:'day3', exIndex:3},
  {label:'Incline Smith Press', day:'day4', exIndex:0},
];

const TABS = [
  {id:'home', label:'Home', icon:ICONS.home},
  {id:'train', label:'Train', icon:ICONS.barbell},
  {id:'progress', label:'Progress', icon:ICONS.ruler},
  {id:'summary', label:'Summary', icon:ICONS.chart},
];

/* ============================= STATE ============================= */
let state = { logs:{}, progress:[] };
let currentPage = 'home';
let currentTrainDay = 'day1';
let currentWeek = { day1:1, day2:1, day3:1, day4:1 };
let saveTimer = null;
let touchStartX = null, touchStartY = null;

/* ============================= STORAGE ============================= */
async function loadAll(){
  try{
    for(const d of DAYS){
      for(const w of WEEKS){
        const key = `log_${d.id}_w${w.n}`;
        try{
          const res = await window.storage.get(key, false);
          if(res && res.value) state.logs[key] = JSON.parse(res.value);
        }catch(e){}
      }
    }
    try{
      const res = await window.storage.get('progress_entries', false);
      if(res && res.value) state.progress = JSON.parse(res.value);
    }catch(e){ state.progress = []; }
  }catch(e){ console.error('Load error', e); }
}

function blankLog(day){ return { date:'', exercises: day.exercises.map(()=>({ sets: [], notes:'' })) }; }

function getLog(dayId, week){
  const day = DAYS.find(d=>d.id===dayId);
  const key = `log_${dayId}_w${week}`;
  if(!state.logs[key]) state.logs[key] = blankLog(day);
  day.exercises.forEach((ex,i)=>{
    const entry = state.logs[key].exercises[i] || {sets:[],notes:''};
    while(entry.sets.length < ex.sets) entry.sets.push({w:'',r:'',rir:''});
    state.logs[key].exercises[i] = entry;
  });
  return state.logs[key];
}

function saveLog(dayId, week){ queueSave(`log_${dayId}_w${week}`, state.logs[`log_${dayId}_w${week}`]); }
function saveProgress(){ queueSave('progress_entries', state.progress); }

function queueSave(key, value){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(key, JSON.stringify(value), false); showToast(); }
    catch(e){ console.error('Save failed', e); }
  }, 350);
}

function showToast(){
  const t = document.getElementById('saveToast');
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1300);
}

/* ============================= NAV ============================= */
function renderNav(){
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = `
    <div class="brand">
      <div class="brand-mark"><span class="dot"></span>Iron Log</div>
      <div class="brand-sub">4-Week Chest Block</div>
    </div>
  ` + TABS.map(t=>`
    <div class="side-item ${currentPage===t.id?'active':''}" onclick="goTo('${t.id}')">${t.icon}<span>${t.label}</span></div>
  `).join('');

  const tabbar = document.getElementById('tabbar');
  tabbar.innerHTML = TABS.map(t=>`
    <div class="tab-btn tap ${currentPage===t.id?'active':''}" onclick="goTo('${t.id}')">${t.icon}<span>${t.label}</span></div>
  `).join('');

  const titles = {home:'Iron Log', train:'Train', progress:'Progress', summary:'Summary'};
  document.getElementById('tbTitle').textContent = titles[currentPage] || 'Iron Log';
}

function goTo(page){
  currentPage = page;
  render();
}

/* ============================= RENDER: HOME ============================= */
function renderHome(){
  return `
    <h1 class="page-title">4-Week Chest Priority Program</h1>
    <p class="page-sub">Natural / non-enhanced · 4 days/week · Chest mass + overall growth</p>
    ${plateDivider()}

    <div class="card">
      <h2>Program</h2>
      <div class="kv-grid">
        <div class="k">Goal</div><div class="v">Chest mass + overall muscle growth</div>
        <div class="k">Schedule</div><div class="v">Mon / Tue / Thu / Sat</div>
        <div class="k">Chest Frequency</div><div class="v">2× per week (Day 1 + Day 4)</div>
        <div class="k">Main Rule</div><div class="v">Don't chase 1RM PRs. Chase better quality reps + more load/reps at the same RIR.</div>
      </div>
    </div>

    <div class="card">
      <h2>Weekly Schedule</h2>
      <div class="sched-grid">
        ${DAYS.map(d=>`
          <div class="sched-row tap" onclick="goToDay('${d.id}')">
            <div><b>${d.short}</b> — ${d.name}</div>
            <div class="d">${d.tagline || ''}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <h2>RIR Progression</h2>
      <div class="week-strip">
        ${WEEKS.map(w=>`
          <div class="week-pill">
            <div class="wn">Week ${w.n} · ${w.label}</div>
            <div style="color:var(--ink-dim);margin-bottom:4px;">${w.rir}</div>
            <div style="color:var(--ink-faint);font-size:11px;">${w.note}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <h2>Rest Periods</h2>
      <div class="kv-grid">
        <div class="k">Compound lifts</div><div class="v">2.5–3 min</div>
        <div class="k">Machines / rows</div><div class="v">~2 min</div>
        <div class="k">Isolation</div><div class="v">60–120 sec</div>
      </div>
    </div>
  `;
}
function goToDay(dayId){ currentTrainDay = dayId; currentPage='train'; render(); }

function plateDivider(){
  return `<div class="plate-divider"><div class="bar"></div><div class="plates"><div class="p p3"></div><div class="p p2"></div><div class="p p1"></div><div class="p p2"></div><div class="p p3"></div></div><div class="bar"></div></div>`;
}

/* ============================= RENDER: TRAIN ============================= */
function renderTrain(){
  const day = DAYS.find(d=>d.id===currentTrainDay);
  const week = currentWeek[day.id];
  const wMeta = WEEKS.find(w=>w.n===week);
  const log = getLog(day.id, week);

  return `
    <h1 class="page-title">${day.short} — ${day.name}</h1>
    <p class="page-sub">${day.tagline || 'Accessory + support day'}</p>

    <div class="day-chips">
      ${DAYS.map(d=>`<div class="day-chip tap ${d.id===day.id?'active':''}" onclick="switchTrainDay('${d.id}')">${d.short}${d.tagline?'<span class="flame">🔥</span>':''}</div>`).join('')}
    </div>

    <div class="week-tabs">
      ${WEEKS.map(w=>`<div class="week-tab tap ${w.n===week?'active':''}" onclick="setWeek('${day.id}',${w.n})">W${w.n}</div>`).join('')}
    </div>

    <div class="week-meta">
      <div><b>Week ${wMeta.n} · ${wMeta.label}</b></div>
      <div>${wMeta.rir}</div>
      <div style="color:var(--ink-faint);">${wMeta.note}</div>
    </div>

    <div class="swipe-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
      swipe to change week
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <div class="date-row">
      <label>Session date</label>
      <input type="date" value="${log.date||''}" onchange="updateDate('${day.id}',${week},this.value)">
    </div>

    <div id="exerciseList">
      ${day.exercises.map((ex,i)=>renderExercise(day.id, week, ex, i)).join('')}
    </div>

    <div class="total-row">
      <div>Session total volume</div>
      <div class="num" id="total_${day.id}_${week}">${sessionVolume(day.id,week).toLocaleString()} kg</div>
    </div>
  `;
}
function switchTrainDay(dayId){ currentTrainDay = dayId; render(); }

function renderExercise(dayId, week, ex, idx){
  const log = getLog(dayId, week);
  const entry = log.exercises[idx];
  const vol = exerciseVolume(entry);
  return `
    <div class="exercise">
      <div class="exercise-head">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-tags">
            <span class="tag">${ex.target}</span>
            ${ex.start ? `<span class="tag">start ${ex.start}</span>` : ''}
            ${ex.chest ? `<span class="tag" style="color:var(--iron);border-color:var(--iron);">chest</span>` : ''}
          </div>
        </div>
        <div class="ex-volume">Volume<b id="exvol_${dayId}_${week}_${idx}">${vol.toLocaleString()}</b></div>
      </div>
      <div class="set-rows">
        <div class="set-col-labels"><span>Weight</span><span>Reps</span><span>RIR</span></div>
        ${entry.sets.map((s,si)=>`
          <div class="set-row">
            <div class="set-num">S${si+1}</div>
            <div class="field"><input type="text" inputmode="decimal" placeholder="kg" value="${s.w}" onchange="updateSet('${dayId}',${week},${idx},${si},'w',this.value)"></div>
            <div class="field"><input type="text" inputmode="numeric" placeholder="reps" value="${s.r}" onchange="updateSet('${dayId}',${week},${idx},${si},'r',this.value)"></div>
            <div class="field"><input type="text" inputmode="numeric" placeholder="rir" value="${s.rir}" onchange="updateSet('${dayId}',${week},${idx},${si},'rir',this.value)"></div>
          </div>
        `).join('')}
      </div>
      <div class="notes-field">
        <textarea placeholder="Notes — form cues, how it felt…" onchange="updateExNotes('${dayId}',${week},${idx},this.value)">${entry.notes||''}</textarea>
      </div>
    </div>
  `;
}

function exerciseVolume(entry){
  return entry.sets.reduce((sum,s)=>{
    const w = parseFloat(s.w); const r = parseFloat(s.r);
    if(!isNaN(w) && !isNaN(r)) return sum + w*r;
    return sum;
  },0);
}
function sessionVolume(dayId, week){
  const log = getLog(dayId, week);
  return log.exercises.reduce((sum,e)=>sum+exerciseVolume(e),0);
}

/* ---- handlers ---- */
function setWeek(dayId, week){ currentWeek[dayId] = week; render(); }
function updateDate(dayId, week, val){ const log = getLog(dayId, week); log.date = val; saveLog(dayId, week); }
function updateSet(dayId, week, exIdx, setIdx, field, val){
  const log = getLog(dayId, week);
  log.exercises[exIdx].sets[setIdx][field] = val;
  saveLog(dayId, week);
  const evEl = document.getElementById(`exvol_${dayId}_${week}_${exIdx}`);
  if(evEl) evEl.textContent = exerciseVolume(log.exercises[exIdx]).toLocaleString();
  const totEl = document.getElementById(`total_${dayId}_${week}`);
  if(totEl) totEl.textContent = sessionVolume(dayId,week).toLocaleString() + ' kg';
}
function updateExNotes(dayId, week, exIdx, val){
  const log = getLog(dayId, week);
  log.exercises[exIdx].notes = val;
  saveLog(dayId, week);
}

/* ---- swipe between weeks ---- */
function attachSwipe(){
  const el = document.getElementById('main');
  el.ontouchstart = (e)=>{
    if(currentPage!=='train') return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  };
  el.ontouchend = (e)=>{
    if(currentPage!=='train' || touchStartX===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
      const week = currentWeek[currentTrainDay];
      if(dx < 0 && week < 4) setWeek(currentTrainDay, week+1);
      else if(dx > 0 && week > 1) setWeek(currentTrainDay, week-1);
    }
  };
}

/* ============================= RENDER: PROGRESS ============================= */
function renderProgress(){
  if(state.progress.length===0){
    state.progress.push({id:cryptoId(), week:1, date:'', bw:'', chest:'', photo:'', notes:''});
  }
  return `
    <h1 class="page-title">Weekly Progress</h1>
    <p class="page-sub">Bodyweight, chest measurement, and photo links — same time each week, ideally fasted.</p>
    ${plateDivider()}
    <div class="card" style="overflow-x:auto;">
      <table class="prog-table">
        <thead><tr>
          <th style="width:56px;">Wk</th><th style="width:128px;">Date</th><th>BW (kg)</th><th>Chest (cm)</th><th>Photo link</th><th>Notes</th><th></th>
        </tr></thead>
        <tbody>
          ${state.progress.map((row,i)=>`
            <tr>
              <td><input type="text" inputmode="numeric" value="${row.week}" style="max-width:40px;" onchange="updateProgress(${i},'week',this.value)"></td>
              <td><input type="date" value="${row.date}" onchange="updateProgress(${i},'date',this.value)"></td>
              <td><input type="text" inputmode="decimal" value="${row.bw}" onchange="updateProgress(${i},'bw',this.value)"></td>
              <td><input type="text" inputmode="decimal" value="${row.chest}" onchange="updateProgress(${i},'chest',this.value)"></td>
              <td><input type="text" placeholder="link" value="${row.photo}" onchange="updateProgress(${i},'photo',this.value)"></td>
              <td><input type="text" placeholder="notes" value="${row.notes}" onchange="updateProgress(${i},'notes',this.value)"></td>
              <td><button class="del-btn tap" onclick="deleteProgressRow(${i})">✕</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
      <button class="add-row-btn tap" onclick="addProgressRow()">+ Add week</button>
    </div>
  `;
}
function cryptoId(){ return Math.random().toString(36).slice(2,10); }
function addProgressRow(){
  const nextWeek = state.progress.length+1;
  state.progress.push({id:cryptoId(), week:nextWeek, date:'', bw:'', chest:'', photo:'', notes:''});
  saveProgress(); render();
}
function deleteProgressRow(i){ state.progress.splice(i,1); saveProgress(); render(); }
function updateProgress(i, field, val){ state.progress[i][field] = val; saveProgress(); }

/* ============================= RENDER: SUMMARY ============================= */
function renderSummary(){
  return `
    <h1 class="page-title">Main Lift Progression</h1>
    <p class="page-sub">Set 1 weight, pulled automatically from each day's log across all 4 weeks.</p>
    ${plateDivider()}
    <div class="card">
      ${MAIN_LIFTS.map(lift=>{
        const vals = WEEKS.map(w=>{
          const log = getLog(lift.day, w.n);
          const entry = log.exercises[lift.exIndex];
          const w0 = entry && entry.sets[0] ? parseFloat(entry.sets[0].w) : NaN;
          return isNaN(w0) ? null : w0;
        });
        const max = Math.max(1, ...vals.filter(v=>v!==null));
        return `
          <div class="lift-row">
            <div class="lift-name">${lift.label}</div>
            <div class="bars">
              ${vals.map((v,i)=>`
                <div class="bar-col">
                  <div class="wk">Week ${i+1}</div>
                  <div class="wt ${v===null?'empty':''}">${v===null?'—':v+' kg'}</div>
                  <div class="bar-fill-track"><div class="bar-fill" style="width:${v===null?0:(v/max*100)}%;"></div></div>
                </div>`).join('')}
            </div>
          </div>`;
      }).join('')}
    </div>
  `;
}

/* ============================= ROUTER ============================= */
function render(){
  renderNav();
  const main = document.getElementById('main');
  let html = '';
  if(currentPage==='home') html = renderHome();
  else if(currentPage==='train') html = renderTrain();
  else if(currentPage==='progress') html = renderProgress();
  else if(currentPage==='summary') html = renderSummary();
  html += `<div class="footer-actions">
    <button class="reset-btn tap" onclick="resetAll()">Clear all data</button>
  </div>`;
  main.innerHTML = html;
  main.classList.remove('transitioning');
  void main.offsetWidth;
  main.classList.add('transitioning');
  window.scrollTo(0,0);
  attachSwipe();
}

async function resetAll(){
  if(!confirm('This clears every logged set, note, and progress entry. This cannot be undone. Continue?')) return;
  try{
    for(const d of DAYS){
      for(const w of WEEKS){
        try{ await window.storage.delete(`log_${d.id}_w${w.n}`, false); }catch(e){}
      }
    }
    try{ await window.storage.delete('progress_entries', false); }catch(e){}
    state.logs = {}; state.progress = [];
    render(); showToast();
  }catch(e){ console.error('Reset failed', e); }
}



/* ============================= INIT ============================= */
(async function init(){
  await loadAll();
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('shell').style.display='flex';
  render();
})();
</script>
</body>
</html>
